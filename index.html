<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cyber Kith — a gamified study companion that levels up with you."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Cyber Kith — Gamified Study Companion</title>
    <script>
      // Opening this file directly (file://) would show a blank page with Vite modules.
      // Send downloaders to the offline single-file build instead.
      (function () {
        if (location.protocol !== 'file:') return
        var path = (location.pathname || '').replace(/\\/g, '/')
        if (path.indexOf('/play/') !== -1 || /\/play\/index\.html$/i.test(path)) return
        var dir = path.substring(0, path.lastIndexOf('/') + 1)
        location.replace(dir + 'play/index.html')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="color: #e8f2ed; font-family: sans-serif; padding: 2rem">
        Cyber Kith needs JavaScript. If you opened the project folder directly, open
        <strong>play/index.html</strong> instead.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
